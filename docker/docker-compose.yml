services:
  ecommerce-postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_DB: 'sport_center'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: '12345'
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ecommerce-redis:
    image: "redis:latest"
    container_name: "spring-redis-container"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  postgres-data:
