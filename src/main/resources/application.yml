spring:
  application:
    name: SportCenter
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://localhost:5432/sport_center
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    # DB hiện có (schema dựng bằng ddl-auto) được baseline 1 lần,
    # các migration V2+ chạy tiếp. DB mới: chạy 1 lần với ddl-auto update
    # (profile mặc định) để dựng schema rồi mới bật prod.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  version: v1
  url: http://localhost:9000
  jwt:
    # Generate a strong random 256-bit+ secret for production, e.g. `openssl rand -base64 64`
    secret: change-me-to-a-very-long-random-secret-at-least-32-bytes-for-hs256-jwt-please
    expiration-ms: 300000 # legacy fallback for access token (5m)
    access-expiration-ms: 300000 # 5m (short: bounds the reuse window of a logged-out access token)
    refresh-expiration-ms: 604800000 # 7d

  auth:
    bloom-expected-insertions: 10000
    bloom-fpp: 0.01
    bloom-rebuild-ms: 3600000 # 1h

  # Ảnh nghiệm thu qua Zipline tự host (docker/shop-zipline).
  # Setup: mở Zipline tạo admin -> Settings/API keys -> dán token vào đây.
  zipline:
    base-url: http://localhost:3001
    api-key: MTc5MTA5OTQyMTY1Mw==.YzEyNzI2NWQyODNhNTA0ODg0YmI5MzA5LmZlYmZhYTJmMDNjMjdiOTQ2ZGViZTRlNTdkYTY4YWUxOThkOWNkM2IwYjhmNjE2Y2UwZTA4OWU0MmY4NzIxNmMxNTJmMWRhNWQ4ODQzMTNlMGVhOWI5ZDY5OGVlY2M1MGI2Yzg4NzQ4NDJhZTFkMjE5MWQ2Yzg2M2E5M2I1OWE1NzQuMjc1MjI3ODIzODI4YjhkMWMyNTVlNmNiY2EyNGJjNjk=

server:
  port: 9000

---
# Profile prod: Hibernate chỉ kiểm tra schema (không tự sửa),
# mọi thay đổi schema đi qua Flyway migration có review.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
